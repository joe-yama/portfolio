name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job name `check` is the required status check of the ruleset
  # (docs/harness/ruleset.json). Renaming it blocks every merge.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Context budget (AGENTS.md + CLAUDE.md + .claude/rules <= 16000 bytes)
        run: |
          bytes=$(cat AGENTS.md CLAUDE.md .claude/rules/*.md | wc -c)
          echo "context bytes: $bytes"
          test "$bytes" -le 16000
      # Runs on every change, documentation-only ones included: no `if:` here and no path filter on the workflow.
      - name: OpenSpec agent files (only the opsx commands propose, archive, update and sync stay)
        run: |
          bad=$({
            find .claude/skills -mindepth 1 -maxdepth 1 -name 'openspec-*'
            find .claude/commands/opsx -mindepth 1 ! -name propose.md ! -name archive.md ! -name update.md ! -name sync.md
          } 2>/dev/null | sort || true)
          if [ -n "$bad" ]; then
            echo "These OpenSpec files were stripped and have come back (openspec update restores them). Delete them:"
            echo "$bad"
            exit 1
          fi
      # The first change adds the stack's setup, lint, typecheck, test and build steps here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager in package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
