name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に複数のデプロイを走らせない
concurrency:
  group: pages
  cancel-in-progress: false

# トップレベルの permissions は無く、job ごとに必要最小限を明示している（下記）。
# 新しい job を足すときは permissions を明示すること。無いとリポジトリ既定の
# permissions を継承してしまう。
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          # .node-version は読まれないので明示する（README で確認。既定は 24）
          node-version: 26.8.2

  deploy:
    needs: build
    # actions/deploy-pages@v5 の README で確認: デプロイジョブに要るのは pages: write と
    # id-token: write だけで、contents: read は不要（リポジトリを checkout しない）
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
